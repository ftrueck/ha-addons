name: "Meshtastic BLE Bridge"
version: "1.0.1"
slug: meshtastic_ble_bridge
description: "Expose Meshtastic over BLE as Meshtastic TCP (port 4403) using yeraze/meshtastic-ble-bridge"
url: "https://github.com/Yeraze/meshtastic-ble-bridge"
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386

startup: services
boot: auto
init: false

host_dbus: true
full_access: true

ports:
  4403/tcp: 4403
ports_description:
  4403/tcp: "Meshtastic TCP bridge port"

build_from:
  aarch64: ghcr.io/yeraze/meshtastic-ble-bridge:latest
  amd64:   ghcr.io/yeraze/meshtastic-ble-bridge:latest
  armv7:   ghcr.io/yeraze/meshtastic-ble-bridge:latest
  armhf:   ghcr.io/yeraze/meshtastic-ble-bridge:latest
  i386:    ghcr.io/yeraze/meshtastic-ble-bridge:latest

options:
  ble_address: ""
  port: 4403
  scan_only: false

schema:
  ble_address: "str"
  port: "int(1,65535)"
  scan_only: "bool"
